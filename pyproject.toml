[project]
name = "expense-tracker"
version = "1.0.0"
description = "A CLI expense tracker"
requires-python = ">=3.10"
dependencies = [
    "prettytable",
    "python-dotenv",
    "requests"
]

[project.scripts]
expense = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "expenses", "exchange_rate", "budgets", "notion_sync"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"